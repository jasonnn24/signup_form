<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
        <div class="imageContainer">
            <img src="mog.jpg" alt="chin jung woo">
            <h1 class="imageText">Sung Chin Woo</h1>
        </div>
        <div class="rightBox">
            <form action="submit">
                
                <div class="headerText">
                    <p>This is totally a real online service! You  know you need something truly amazing like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                    <p>You know you want to subscribe to us.</p>
                </div>
              
                <div class="inputContainer">
                    <p>You're one step closer to aura.</p>
                    <div class="inputs">
                        <div>
                            <label for="firstName">First Name</label>
                            <input
                            type="text"
                            id="firstName"
                            >
                        </div>

                        <div>
                            <label for="lastName">Last Name</label>
                            <input
                            type="text"
                            id="lastName"
                            >
                        </div>

                        <div>
                            <label for="email">Email</label>
                            <input
                            type="text"
                            id="email"
                            >
                        </div>

                        <div>
                            <label for="phone">Phone Num.</label>
                            <input
                            type="text"
                            id="phone"
                            >
                        </div>

                         <div>
                            <label for="">Password</label>
                            <input
                            type="text"
                            id="password"
                            >
                        </div>

                        <div>
                            <label for="">Confirm Password</label>
                            <input
                            type="text"
                            id="confirmPassword"
                            >
                        </div>

                        
                    </div>
                    
                </div>
                
                <div class="bottomText">
                    <button>Create Account</button>
                    <p>Already have an account? <a href="">Log In</a></p> 
                </div>    
                </form>
        </div>
   </div> 
</body>
</html>
