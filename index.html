<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
        <img src="mog.jpg" alt="chin jung woo">
        <div class="rightBox">
            <form action="submit">
                <p>This is totally a real online service! You  know you need something truly amazing like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p>You know you want to subscribe to us.</p>
                <div class="input-form">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName">

                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName">

                    <label for="email">Email</label>
                    <input type="text" id="email">

                    <label for="phone">Phone Num.</label>
                    <input type="text" id="phone">

                    <label for="password">Password</label>
                    <input type="text" id="password">

                    <label for="">Confirm Password</label>
                    <input type="text" id="confirmPassword">
                </div>
                <button>Create Account</button>
                <p>Already have an account?</p> <a href="">Log in</a>
            </form>
        </div>
   </div> 
</body>
</html>
